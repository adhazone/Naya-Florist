<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toko Bunga Naya · Mode Cerita</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a1026;--mute:#8a5a6c;--grad:linear-gradient(135deg,#ffb26b,#ff8fb1);--grad2:linear-gradient(135deg,#ff9a56,#ff6f9c);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#fff5ec;color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif}
.page{max-width:1100px;margin:0 auto;padding:12px}
.rot{display:none;background:#ffe3d1;border-radius:12px;padding:10px 14px;margin-bottom:10px}
@media (orientation:portrait) and (max-width:700px){.rot{display:block}}
.full:fullscreen{display:grid;place-items:center;background:#fff5ec}
.stage{position:relative;aspect-ratio:16/9;width:100%;border-radius:16px;overflow:hidden;font-size:16px;display:grid;grid-template-columns:70% 30%;grid-template-rows:auto 1fr;background:#fff1e6;box-shadow:0 6px 24px #ff8fb133;--ct:14.2em;--cp:6em;--cw:13em;--nt:7em;--gx:-8em}
.stage.v{aspect-ratio:9/16;width:min(100%,calc(86vh*.5625));margin:0 auto;grid-template-columns:1fr;grid-template-rows:auto auto 1fr;padding-top:var(--padT,0px);background:linear-gradient(#fffaf5 0,#fff1e6 25%);--ct:11.5em;--cp:4.9em;--cw:10.5em;--nt:5.5em;--gx:-5.2em}
.full:fullscreen .stage{width:min(100vw,177.78vh);border-radius:0}
.full:fullscreen .stage.v{width:min(100vw,67.5vh);height:100vh;aspect-ratio:auto;border-radius:0}
.hdr{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:.4em;padding:.7em 1em .5em;z-index:8;white-space:nowrap;background:linear-gradient(180deg,#fffaf5,#fff1e6);font-weight:600}
.v .hdr{grid-row:1;padding:.6em .8em .4em;font-size:.88em}
.pill{background:var(--grad2);color:var(--ink);border-radius:99px;padding:.25em .9em;box-shadow:0 .15em .5em #ff6f9c55}
#hCash{font-size:1.12em}
.sign{background:var(--grad);border:.15em solid #fff;border-radius:.9em;padding:.2em 1em;font-weight:700;font-size:1.2em;box-shadow:0 .2em .5em #ff8fb155;animation:swing 4s ease-in-out infinite;transform-origin:50% 0}
@keyframes swing{50%{transform:rotate(1.5deg)}}
.scene{position:relative;overflow:hidden;min-height:0}
.v .scene{grid-row:3}
#bg,#bg svg{position:absolute;inset:0;width:100%;height:100%}
.who{position:absolute;top:var(--nt);height:var(--cw);width:calc(var(--cw)*.78)}
.who svg,.who img{height:100%;width:auto;max-width:100%;display:block}
#naya{left:25.5em;z-index:2}#naya img{filter:drop-shadow(0 .3em .4em #3a102633)}
#cust{left:3.5em;z-index:4}#cust svg{filter:drop-shadow(0 0 .1em #fff) drop-shadow(0 .3em .35em #3a102640)}
#helper{left:37em;top:calc(var(--nt) + 1.6em);height:calc(var(--cw)*.85);z-index:1;display:none}
.v #naya{left:13.6em}.v #cust{left:.8em}.v #helper{left:18.4em;top:calc(var(--nt) + 1.2em)}
.in{animation:enter .7s ease-out}@keyframes enter{from{transform:translateX(-12em);opacity:0}}
.out{animation:leave .8s ease-in forwards}@keyframes leave{to{transform:translateX(-14em);opacity:0}}
.counter{position:absolute;left:-1em;right:-1em;top:var(--ct);height:var(--cp);z-index:3;border-radius:.5em .5em 0 0;background:var(--front);box-shadow:0 .4em .8em #3a102622}
.counter::before{content:"";position:absolute;left:0;right:0;top:0;height:.7em;border-radius:.5em .5em 0 0;background:var(--top)}
.c0{--front:linear-gradient(#d9965f,#b9703c);--top:#f2c08c}
.c1{--front:linear-gradient(#ffffff,#f0e9e2);--top:#e8c27a}
.c2{--front:radial-gradient(circle at 50% 50%,#ffffff88 .3em,transparent .35em) 0 0/2.2em 2.2em,linear-gradient(#ffb3cd,#ff8fb1);--top:#ffe3ec}
#bq{position:absolute;left:15.5em;top:calc(var(--ct) - 9.8em);width:8.5em;height:10.3em;z-index:5;opacity:0;transition:transform .8s ease-in,opacity .4s}
.v #bq{left:8.4em;top:calc(var(--ct) - 6em);width:6.6em;height:6.4em}
#bq.show{opacity:1}#bq.give{transform:translate(var(--gx),1.5em) scale(.8)}#bq svg{width:100%;height:100%;overflow:visible}
.it{animation:appear .38s ease-out both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes appear{from{opacity:0;transform:translateY(-1.6em) scale(.6)}}
.flap{animation:flap .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes flap{to{transform:scaleX(.55)}}.glow{animation:glow 1.2s ease-in-out infinite alternate}@keyframes glow{to{opacity:.45}}
#notes{position:absolute;left:9.5em;top:calc(var(--ct) - 5em);z-index:7;display:flex;gap:.3em;transform:rotate(-8deg)}
.v #notes{left:.6em;top:calc(var(--ct) - 4.4em)}
#notes svg{width:9em;height:4.4em;filter:drop-shadow(0 .2em .3em #0003);animation:wave 1.4s ease-in-out infinite alternate}
.v #notes svg{width:7em;height:3.4em}
@keyframes wave{to{transform:translateY(-.4em) rotate(4deg)}}
.bub{position:absolute;left:1em;top:1em;width:14em;z-index:6}
.v .bub{left:.5em;right:.5em;width:auto;top:.4em}
.bub div{background:#fff;border-radius:1.2em;border-bottom-left-radius:.3em;padding:.5em .9em;font-size:1.05em;line-height:1.3;box-shadow:0 .2em .7em #ff8fb144;animation:enter2 .35s ease-out}
.v .bub div{font-size:.88em;padding:.4em .8em}
@keyframes enter2{from{transform:scale(.7);opacity:0}}
#naya img{animation:nb 3.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes nb{0%,100%{transform:scale(1,1) rotate(-.8deg)}50%{transform:scale(1.015,1.025) rotate(.8deg)}}
#naya.pick img{animation:np .6s ease-in-out infinite}@keyframes np{50%{transform:translateX(-.5em) rotate(-5deg) scale(1.03)}}
#naya.wrap img{animation:nw .5s ease-in-out infinite}@keyframes nw{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
#naya.give img{animation:ng .9s ease-in-out 1}@keyframes ng{40%{transform:translateX(-3em) rotate(-8deg) scale(1.05)}}
#naya.joy img{animation:nj .6s ease-out 2}@keyframes nj{40%{transform:translateY(-1.2em) scale(1.04)}}
.bd{animation:br 3.4s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
.hd{animation:nod 4.2s ease-in-out infinite;transform-origin:50% 85%;transform-box:fill-box}
.arm{animation:sw 3.4s ease-in-out infinite;transform-origin:50% 8%;transform-box:fill-box}.arm.r{animation-delay:-1.7s}
@keyframes br{50%{transform:scale(1.02,1.03)}}@keyframes nod{25%{transform:rotate(2.5deg)}75%{transform:rotate(-2.5deg)}}@keyframes sw{50%{transform:rotate(5deg)}}
.dock{background:linear-gradient(180deg,#fffaf5,#ffe8e0);padding:1em;display:flex;flex-direction:column;gap:.6em;min-height:0;border-left:.25em solid #ffc9b0}
.v .dock{grid-row:2;border-left:0;border-bottom:.25em solid #ffc9b0;padding:.3em .9em .6em;gap:.4em}
.chips{display:flex;flex-wrap:wrap;gap:.35em;min-height:2.6em}
.v .chips{min-height:0;gap:.3em}
.chip{display:flex;align-items:center;gap:.3em;background:#fff;border:.12em solid #ffc9b0;border-radius:99px;padding:.1em .7em .1em .3em;font-size:.85em;font-weight:600;white-space:nowrap}
.v .chip{font-size:.72em}
.chip svg{width:1.7em;height:1.9em}
.qq{font-size:1.3em;font-weight:600;line-height:1.25}.v .qq{font-size:1.02em}
.hx{font-size:.85em;color:var(--mute)}.v .hx{display:none}
.pbar{height:.8em;background:#ffd9cc;border-radius:99px;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:var(--grad2)}
.opts{display:grid;grid-auto-rows:1fr;gap:.6em;flex:1;min-height:0}
.v .opts{grid-auto-flow:column;grid-auto-columns:1fr;grid-auto-rows:auto;flex:none}
.opt{position:relative;font:inherit;font-weight:600;font-size:1.7em;color:var(--ink);background:var(--grad);border:.1em dashed #fffd;border-radius:.8em;cursor:pointer;box-shadow:0 .2em .6em #ff8fb155;animation:tagin .4s ease-out both}
.opt::before{content:"";position:absolute;left:.45em;top:50%;width:.4em;height:.4em;margin-top:-.2em;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 .08em #ff9a56}
.v .opt{font-size:1.2em;padding:.65em .1em}.v .opt::before{display:none}
.opt:nth-child(2){animation-delay:.12s}.opt:nth-child(3){animation-delay:.24s}
@keyframes tagin{from{transform:translateY(1em) scale(.8);opacity:0}}
.opt:active{transform:scale(.96)}.opt.ok{background:linear-gradient(135deg,#8be3a8,#4fd19a)}.opt.no{background:linear-gradient(135deg,#ffb3b3,#ff8a8a)}.opt:disabled{cursor:default}
.ov{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#fff5ecf2,#ffe3ecf2);padding:1.2em;z-index:20;overflow:auto}
.ov h1{margin:0 0 .2em;font-size:3em;line-height:1.05}.ov h2{margin:0 0 .3em;font-size:1.9em}.ov p{margin:0 0 .7em;font-size:1.2em;color:var(--mute);line-height:1.35}
.go{font:inherit;font-weight:600;font-size:1.3em;padding:.45em 1.6em;border:0;border-radius:99px;background:var(--grad2);color:var(--ink);cursor:pointer;box-shadow:0 .2em .7em #ff6f9c55}
.go.sm{font-size:1em;padding:.3em 1em}.go:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,label:focus-within{outline:3px solid var(--ink);outline-offset:2px}
.md{font:inherit;border:.12em solid #ff8fb1;background:#fff;color:var(--ink);border-radius:99px;padding:.3em 1.1em;font-size:1.1em;cursor:pointer;margin:0 .3em .5em}
.md.on{background:var(--grad2)}.v .md{display:block;margin:.4em auto}
.lk{background:none;border:0;color:var(--mute);font:inherit;font-size:1em;text-decoration:underline;cursor:pointer;margin-top:.5em}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em;margin:.5em 0 .9em}.v .cards{grid-template-columns:1fr 1fr}
.card{background:#fff;border:.15em solid #ffc9b0;border-radius:1em;padding:.6em;display:flex;flex-direction:column;gap:.25em;font-size:.95em}
.card b{font-size:1.1em}.card small{color:var(--mute);line-height:1.2}.card .lvn{font-weight:600}
.rp{display:flex;gap:1.2em;align-items:center;text-align:left}.rp img{height:11em}.v .rp{flex-direction:column;text-align:center}.v .rp img{height:6em}
.rep{display:grid;grid-template-columns:1fr auto;gap:.2em 1.5em;font-size:1.2em;margin:.4em 0;background:#fff;border:.15em solid #ffc9b0;border-radius:1em;padding:.5em .9em}.rep b{text-align:right}
.row3{display:flex;gap:.6em;margin-top:.5em}.row3 .opt{flex:1;font-size:1.3em;padding:.6em .2em}.row3 .opt::before{display:none}
.fly{position:absolute;left:0;top:0;width:3.4em;height:1.7em;border-radius:.3em;background:linear-gradient(135deg,#9be8b8,#4fd19a);border:.12em solid #fff;color:#04281a;font-weight:700;font-size:.95em;display:grid;place-items:center;z-index:30;pointer-events:none;box-shadow:0 .2em .4em #0003}
.plus{position:absolute;right:1em;top:3em;z-index:31;font-weight:700;color:#14724a;font-size:1.3em;text-shadow:0 0 .3em #fff;animation:rise 1.4s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translateY(.8em)}20%{opacity:1}100%{opacity:0;transform:translateY(-1.4em)}}
.bump{animation:bump .6s ease-out}@keyframes bump{40%{transform:scale(1.25)}}
.bar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:center;margin-top:12px}
.ctl{font:inherit;padding:.5rem 1.1rem;border-radius:99px;border:0;background:var(--grad2);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;font-weight:600}
.ctl input{accent-color:#ff6f9c;width:1.1rem;height:1.1rem}
.tip{color:var(--mute);font-size:.9rem;margin:10px 0 0;line-height:1.45;text-align:center}
</style></head>

 $('rs').onclick=()=>{if(!sure){sure=true;$('rs').textContent='Yakin? Tekan lagi untuk menghapus progres';return}clearT();G={ph:'idle',tms:[]};S={cash:500,day:0,t:0,s:0,k:0,d:0,p:0,c:0};save();menu()}}
function intro(){showOv(`<div class="rp"><img alt="Naya" src="${$('naya').firstChild.src}"><div><h2>Tanah kosong...</h2><p>Naya punya modal <b>${fmt(500)}</b> dan satu mimpi: membuka toko bunga. Langkah pertama: beli lapak!</p><button class="go" id="g">Belanja modal pertama</button></div></div>`);$('g').onclick=shop}
function shop(msg){
 scene();const ready=S.t>0;
 const card=k=>{const u=UP[k],lv=S[k],mx=u.pr.length,lock=k=='p'&&S.t<2;return `<div class="card"><b>${u.n}</b><small>${u.e}</small>${lv>=mx?'<span class="lvn">Maksimal</span>':`<span class="lvn">${u.lv[lv]}</span><button class="go sm" data-k="${k}" ${!lock&&S.cash>=u.pr[lv]?'':'disabled'}>${lock?'Terkunci':fmt(u.pr[lv])}</button>`}</div>`};
 showOv(`<div><h2>Belanja malam · Kas ${fmt(S.cash)}</h2><p>${msg||(ready?'Beli perkembangan toko, atau langsung buka hari berikutnya.':'Beli lapak dulu supaya bisa berjualan.')}</p><div class="cards">${Object.keys(UP).map(card).join('')}</div><button class="go" id="gd" ${ready?'':'disabled'}>Buka hari ke-${S.day+1}</button><br><button class="lk" id="mn2">Menu</button></div>`);
 document.querySelectorAll('.card .go').forEach(b=>b.onclick=()=>buyQ(b.dataset.k));$('gd').onclick=startDay;$('mn2').onclick=menu}
function buyQ(k){
 const u=UP[k],p=u.pr[S[k]],a=S.cash-p,o=mc(a,[S.cash+p,a+10,a-10]);
 showOv(`<div><h2>${u.lv[S[k]]}: ${fmt(p)}</h2><p>Kas sekarang <b>${fmt(S.cash)}</b>. Setelah membeli, sisa uang berapa?</p><div class="row3">${o.map(v=>`<button class="opt" data-v="${v}">${fmt(v)}</button>`).join('')}</div></div>`);
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(+b.dataset.v===a){const was=S.cash;S.cash=a;S[k]++;save();sfx.unlock();shop(`${u.lv[S[k]-1]} sudah jadi! Kas sebelum ${fmt(was)}, kas sekarang ${fmt(a)}.`)}else{sfx.boing();shop(`Hitungannya belum tepat. Kas masih ${fmt(S.cash)}, coba lagi ya.`)}})}
function mc(a,ex=[]){const s=new Set([a]);shuf(ex).forEach(v=>{if(s.size<3&&Number.isInteger(v)&&v>=0&&v!=a)s.add(v)});while(s.size<3){const v=a+pick([5,10,2,1,20,3])*pick([1,-1]);if(v>=0)s.add(v)}return shuf([...s])}
/* ---------- hari kerja ---------- */
function mkCust(){
 const kinds=FK.slice(0,FAV[S.s]),cap=[4,6,9][S.s],two=S.t>=2&&R(0,1)&&cap>=4;
 const main=pick(kinds),items=two?[{k:main,n:R(1,cap-2)},{k:pick(kinds.filter(x=>x!=main)),n:0}]:[{k:main,n:R(2,cap)}];
 if(two){items[1].n=R(1,Math.min(cap-items[0].n,4))}
 const wc=pick(WCOL.slice(0,WAV[S.s])),pool=AK[S.s],accs=shuf(pool).slice(0,pool.length?R(0,Math.min(2,pool.length)):0);
 const fl=items.reduce((s,i)=>s+FL[i.k].p*i.n,0),as=accs.reduce((s,k)=>s+ACS[k].p,0),total=fl+as+WRAPP;
 const modal=items.reduce((s,i)=>s+FL[i.k].m*i.n,0)+accs.reduce((s,k)=>s+ACS[k].m,0)+WRAPM;
 const pay=[50,100,150,200].find(x=>x>=total),ch=pay-total,mul=items.reduce((s,i)=>s+i.n+FL[i.k].p,0);
 return{items,wc,accs,total,modal,pay,look:mkLook(),
  steps:[{q:'Berapa total yang harus dibayar pembeli?',a:total,w:`Total ${fmt(total)}`,o:mc(total,[total-WRAPP,total-as,fl,mul+as+WRAPP,total+10,total-10]),think:2.5},
         {q:`Pembeli memberi ${fmt(pay)}. Berapa kembaliannya?`,a:ch,w:`${fmt(pay)} − ${fmt(total)} = ${fmt(ch)}`,o:mc(ch,[ch+10,ch-10,ch+5,pay-fl]),think:1.9}]}}
function order(c){const f=c.items.map(i=>`${i.n} ${FL[i.k].n}`).join(' dan '),a=c.accs.length?`, plus ${c.accs.map(k=>ACS[k].n.toLowerCase()).join(' dan ')}`:'';return `Halo Naya! Aku mau <b>${f}</b>, pembungkus warna <b>${c.wc.n}</b>${a}, ya!`}
function chips(c){$('chips').innerHTML=c.items.map(i=>`<span class="chip">${flowerSVG(i.k)}${FL[i.k].n} ${fmt(FL[i.k].p)}/tangkai</span>`).join('')+c.accs.map(k=>`<span class="chip">${accIcon(k)}${ACS[k].n} ${fmt(ACS[k].p)}</span>`).join('')+`<span class="chip">Pembungkus ${fmt(WRAPP)}</span>`}
function startDay(){
 clearT();$('ov').style.display='none';const n=[0,3,4,5][S.t]+S.k+S.p;
 G={ph:'idle',tms:[],ci:0,n,custs:Array.from({length:n},mkCust),SS:0,MM:0,cash0:S.cash};scene();nextCust()}
function nextCust(){
 clearT();if(G.ci>=G.n)return report();
 const c=G.c=G.custs[G.ci],e=$('cust');e.innerHTML=person(c.look);e.className='who in';$('notes').innerHTML='';$('bq').className='';$('bq').innerHTML='';$('opts').innerHTML='';
 sfx.pop();$('bub').innerHTML='<div>'+order(c)+'</div>';chips(c);$('qq').textContent='Naya menyiapkan pesanan...';$('hx').textContent=`Pembeli ${G.ci+1} dari ${G.n}`;$('pb').style.width='0';G.ph='prep';G.step=0;
 const ns=c.items.reduce((s,i)=>s+i.n,0),ni=ns+1+c.accs.length,dl=c.dl=Math.min(.45,3.6/ni);let t0=800;
 later(t0,()=>{$('bq').innerHTML=bqSVG(c);$('bq').className='show';act('naya','pick');if(S.p)act('helper','pick')});
 for(let i=0;i<ni;i++)later(t0+i*dl*1000,()=>sfx.pluck(i));
 later(t0+ns*dl*1000,()=>{act('naya','wrap')});
 const end=t0+ni*dl*1000+500;
 later(end,()=>{$('bq').classList.add('give');act('naya','give',900);sfx.ding()});
 later(end+1100,()=>{mood('h');$('qq').textContent='Pesanan diserahkan!';later(2300,()=>{G.s=c.steps[0];showOpts()})})}
function showOpts(){
 const s=G.s;G.ph='pick';G.tmax=G.tm=9*(1+.25*S.d);G.lk=0;$('qq').textContent=s.q;$('hx').textContent='Hitung sendiri, lalu pilih jawabanmu!';
 $('opts').innerHTML=s.o.map((v,i)=>`<button class="opt" data-v="${v}" aria-label="Pilihan ${i+1}: ${fmt(v)}">${fmt(v)}</button>`).join('');sfx.pop();
 document.querySelectorAll('#opts .opt').forEach(b=>b.onclick=()=>judge(+b.dataset.v))}
function after(ms,fn){G.fn=fn;if($('auto').checked)G.to=later(ms,go);else{$('qq').insertAdjacentHTML('beforeend',' <button class="go sm" id="nx">Lanjut</button>');$('nx').onclick=go}}
function go(){const f=G.fn;G.fn=null;if(f)f()}
function judge(v){
 if(G.ph!='pick')return;G.ph='fb';const s=G.s,ok=v===s.a,last=G.step==1;
 document.querySelectorAll('#opts .opt').forEach(b=>{b.disabled=true;if(+b.dataset.v===s.a)b.classList.add('ok');else if(+b.dataset.v===v)b.classList.add('no')});
 $('hx').textContent='';
 if(ok){sfx.chime();act('naya','joy',1300);mood('h');$('qq').innerHTML=`<b>Benar!</b> ${s.w}`;
  if(!last){later(1600,()=>{G.step=1;G.s=G.c.steps[1];$('qq').textContent=`Pembeli memberi uang ${fmt(G.c.pay)}...`;$('hx').textContent='';$('opts').innerHTML='';$('pb').style.width='0';$('notes').innerHTML=({50:[50],100:[100],150:[100,50],200:[100,100]})[G.c.pay].map(note).join('');sfx.coin();later(2100,showOpts)});return}
  G.SS+=G.c.total;G.MM+=G.c.modal;payIn(G.c.total)}
 else{sfx.boing();mood('s');$('qq').innerHTML=`<b>${v===null?'Waktu habis!':'Belum tepat.'}</b> ${s.w}. Pembeli pergi tanpa membeli.`;$('notes').innerHTML=''}
 later(900,()=>{$('cust').className='who out';$('bq').style.opacity=0});
 after(ok?2100:3000,()=>{$('bq').style.opacity='';G.ci++;nextCust()})}
function payIn(amt){
 const old=S.cash;S.cash+=amt;
 const sr=$('stage').getBoundingClientRect(),src=($('notes').firstElementChild||$('cust')).getBoundingClientRect(),dst=$('hCash').getBoundingClientRect();
 const n=Math.min(6,Math.max(3,Math.round(amt/20)));let done=0;
 for(let i=0;i<n;i++){
  const d=document.createElement('div');d.className='fly';d.textContent='Rp';$('stage').appendChild(d);
  const fx=src.left-sr.left+src.width/2-20+i*6,fy=src.top-sr.top+src.height/2-10,tx=dst.left-sr.left+dst.width/2-20,ty=dst.top-sr.top+dst.height/2-10;
  const fin=()=>{d.remove();sfx.coin();if(++done==n)bumpCash(old,S.cash)};
  if(d.animate){const a=d.animate([{transform:`translate(${fx}px,${fy}px) rotate(${R(-20,20)}deg) scale(1)`,opacity:1},{transform:`translate(${(fx+tx)/2}px,${fy-60-R(0,40)}px) rotate(${R(-40,40)}deg) scale(1.1)`,opacity:1,offset:.45},{transform:`translate(${tx}px,${ty}px) rotate(0deg) scale(.45)`,opacity:.85}],{duration:900+i*140,delay:i*70,easing:'ease-in-out',fill:'forwards'});a.onfinish=fin}else fin()}
 later(250,()=>{$('notes').innerHTML=''})}
function bumpCash(a,b){
 const el=$('hCash');el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');
 const t0=performance.now(),dur=700,tick=()=>{const p=Math.min(1,(performance.now()-t0)/dur);showCash(Math.round(a+(b-a)*p));if(p<1)requestAnimationFrame(tick)};tick();setTimeout(()=>showCash(S.cash),dur+60);
 const f=document.createElement('div');f.className='plus';f.textContent='+'+fmt(b-a);$('stage').appendChild(f);setTimeout(()=>f.remove(),1500)}
function report(){
 G.ph='rep';const sl=G.SS,md=G.MM,U=sl-md;
 showOv(`<div class="rp"><img alt="Naya" src="${$('naya').firstChild.src}"><div><h2>Laporan malam · Hari ${S.day+1}</h2><div class="rep"><span>Penjualan</span><b>${fmt(sl)}</b><span>Modal & biaya</span><b>${fmt(md)}</b></div><p id="rq">Berapa untung bersihnya?</p><div class="row3" id="rr">${mc(U,[sl,md,U+10,U-10]).map(v=>`<button class="opt" data-v="${v}">${fmt(v)}</button>`).join('')}</div></div></div>`);
 document.querySelectorAll('#rr .opt').forEach(b=>b.onclick=()=>{
  const ok=+b.dataset.v===U;ok?sfx.chime():sfx.boing();S.cash-=md;G.cash0=null;S.day++;save();
  $('rr').innerHTML='<button class="go" id="gs">Lanjut belanja</button>';
  $('rq').innerHTML=`<b>${ok?'Tepat!':'Hampir.'}</b> ${fmt(sl)} − ${fmt(md)} = ${fmt(U)}. Modal dipakai belanja bahan, jadi kas sekarang ${fmt(S.cash)}.`;$('gs').focus();$('gs').onclick=()=>shop()})}
let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
 if(G.ph=='pick'){G.tm-=dt;const p=Math.max(0,G.tm/G.tmax);$('pb').style.width=p*100+'%';const k=Math.ceil(G.tm);if(k!==G.lk){G.lk=k;if(k<=4&&k>0)sfx.tick()}if(G.tm<=0)judge(null)}
 requestAnimationFrame(loop)}
addEventListener('keydown',e=>{if('123'.includes(e.key)&&e.key){const b=document.querySelectorAll('#opts .opt')[+e.key-1];if(b&&!b.disabled)b.click()}if((e.key=='Enter'||e.key==' ')&&$('nx')){e.preventDefault();$('nx').click()}});
$('fs').onclick=()=>{const f=$('full');document.fullscreenElement?document.exitFullscreen():(f.requestFullscreen&&f.requestFullscreen())};
$('mn').onclick=menu;
setMute(MUTE);addEventListener('resize',fit);document.addEventListener('fullscreenchange',()=>setTimeout(()=>{fit();scene()},80));if(window.ResizeObserver)new ResizeObserver(fit).observe($('stage'));scene();menu();requestAnimationFrame(loop);
</script></body></html>
